# Jarvis configuration — edit these without touching code.
# Tunables live here on purpose (Tier 6: configuration over hardcoded values).

identity:
  name: Jarvis
  # One-line purpose, woven into the system prompt.
  purpose: >-
    a personal assistant that has my back — reminds me of things, answers
    questions about my notes, and drafts messages.
  # Tone, also woven into the system prompt.
  tone: warm, plain-spoken, and brief

model:
  # The brain. Kept here so swapping models is a one-line change.
  provider: anthropic
  name: claude-opus-4-8
  max_tokens: 1024
  temperature: 0.7

# Tier 6 — the rails. Safety posture you can tune without touching code.
safety:
  # Tools beyond those already flagged consequential that must ask first.
  always_confirm: []
  # Tools to never prompt for (use sparingly; overrides the consequential flag).
  never_confirm: []
  # How long an interactive confirmation may wait before it safely denies.
  confirm_timeout_seconds: 120

# The Factory — the sub-agent that mints other sub-agents (jarvis/factory).
# Operated via its CLI: `python -m jarvis.factory`.
factory:
  # Most new agents a single requester can stage in a rolling 24h window.
  # Enforced at task creation, not approval, so a flood can't be queued.
  daily_cap: 5
  # How many reject-with-feedback rounds before a task auto-fails.
  max_revisions: 3
  # Poll interval for the host to pick up newly approved agents (Tier 5).
  watch_seconds: 30

# Tier 5 — the heartbeat (proactive loop). Quiet by default.
heartbeat:
  enabled: true
  tick_seconds: 5          # how often the loop wakes to look for due checks
  quiet_hours:             # non-urgent surfacing waits for waking hours
    start: "22:00"
    end: "07:00"
  checks:
    # Verification-friendly: create state/trigger.txt and it gets noticed.
    - name: watch_file
      every_seconds: 10
      params:
        path: state/trigger.txt
        urgency: alert       # calm (held only) | alert (interrupts) | critical
    # Surfaces reminders whose due time has passed; silent unless one is due.
    - name: due_reminders
      every_seconds: 30
      params:
        urgency: alert

# Tier 3 — voice. Unused until you build the ears and mouth.
voice:
  stt:
    provider: deepgram
    model: nova-2
  tts:
    provider: elevenlabs
    # Pick your ElevenLabs voice id here; this default is a calm, natural voice.
    voice_id: ""
    model: eleven_turbo_v2_5
